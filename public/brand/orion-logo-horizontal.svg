<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="380" height="90" fill="none">
  <defs>
    <linearGradient id="bronzeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c26d4a" />
      <stop offset="100%" stop-color="#a45837" />
    </linearGradient>
    <linearGradient id="darkText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>
  </defs>

  <!-- Símbolo Órion "O" Nobre -->
  <g transform="translate(10, 8)">
    <!-- Círculo externo mineral -->
    <circle cx="36" cy="36" r="32" stroke="#153a46" stroke-width="4.5" fill="none" opacity="0.95" />
    <!-- Corte estilizado e ponteiro bronze/terracota -->
    <path d="M 22 56 L 46 22 L 51 25 L 27 59 Z" fill="url(#bronzeGradient)" />
    <circle cx="48" cy="20" r="3" fill="#c26d4a" />
  </g>

  <!-- Divisor Vertical -->
  <line x1="96" y1="18" x2="96" y2="70" stroke="#d5d0c5" stroke-width="1.5" />

  <!-- Tipografia ORIUM -->
  <text x="114" y="47" font-family="'Sora', sans-serif" font-size="34" font-weight="700" letter-spacing="4" fill="url(#darkText)">
    ORIUM
  </text>

  <!-- Subtítulo INVESTIMENTOS -->
  <text x="115" y="68" font-family="'Manrope', sans-serif" font-size="12.5" font-weight="700" letter-spacing="6.5" fill="#b6734c">
    INVESTIMENTOS
  </text>
</svg>
