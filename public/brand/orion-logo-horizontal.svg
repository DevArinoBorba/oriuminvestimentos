<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="380" height="90" fill="none">
  <defs>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7a1fff" />
    </linearGradient>
    <linearGradient id="silverText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Símbolo Orium "O" Cósmico -->
  <g transform="translate(10, 8)">
    <!-- Círculo externo -->
    <circle cx="36" cy="36" r="32" stroke="#ffffff" stroke-width="4.5" fill="none" opacity="0.95" />
    <!-- Corte estilizado e ponteiro violeta luminoso -->
    <path d="M 22 56 L 46 22 L 51 25 L 27 59 Z" fill="url(#purpleGlow)" filter="url(#glow)" />
    <circle cx="48" cy="20" r="3" fill="#c084fc" filter="url(#glow)" />
  </g>

  <!-- Divisor Vertical -->
  <line x1="96" y1="18" x2="96" y2="70" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" />

  <!-- Tipografia ÓRION -->
  <text x="114" y="47" font-family="'Sora', sans-serif" font-size="34" font-weight="700" letter-spacing="4" fill="url(#silverText)">
    ÓRION
  </text>

  <!-- Subtítulo INVESTIMENTOS -->
  <text x="115" y="68" font-family="'Manrope', sans-serif" font-size="12.5" font-weight="700" letter-spacing="6.5" fill="#a855f7">
    INVESTIMENTOS
  </text>
</svg>
